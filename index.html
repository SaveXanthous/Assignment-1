<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <dic class = "container">
        <div class = "card profile">
            <h1>Zhumatayev Diyar</h1>
            <h2>Course - WEB</h2>
            <h3>About Me</h3>
            <p>I am a student at AITU.</p>
        </div>
        
        <div class = "card interests">
            <h3>My Interests web sites</h3>
            <ul>
                <li><a href = "https://www.youtube.com">You Tube</a></li>
                <li><a href = "https://music.youtube.com">You Tube Music</a></li>
                <li><a href = "https://www.telegram.org">Telegram</a></li>
            </ul>
        </div>
        <div class = "card photo">
            <img src = "local/Avatar.jpg" alt = "Avatar" id = "img-avatar" width = "200">
        </div>

        <div class = "card schedule">
            <table>
                <tr>
                    <th>Subject</th>
                    <th>Day</th>
                    <th>Time</th>
                </tr>
                <tr>
                    <td>Web</td>
                    <td>Monday</td>
                    <td>12:00 - 13:00</td>
                </tr>
                <tr>
                    <td>Web</td>
                    <td>Thursday</td>
                    <td>15:00 - 17:00</td>
                </tr>
            </table>
        </div>

        <div class = "card mood">
            <p>
                I like 😺 <br>
                I am 🤫 <br>
                I am 😎
            </p>
        </div>

        <div class = "card input-menu">
            <div class="input-group">
                <label>Name:</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label>Email:</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Color:</label>
                <input type="text" placeholder="Enter your favourite color">
            </div>
            <button class="submit-btn">Submit</button>
        </div>
    </div>
</body>
</html>
